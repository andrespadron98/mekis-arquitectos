; Config PHP solo para desarrollo local de este proyecto.
; Laravel 8.83 sobre PHP 8.4 emite E_DEPRECATED en tiempo de compilacion,
; antes de que Laravel instale su manejador de errores, y eso se cuela en
; el HTML de la respuesta. Aqui lo apagamos sin tocar el php.ini global.
; Se activa exportando:  PHP_INI_SCAN_DIR=":<ruta-del-proyecto>/.php-dev"
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
