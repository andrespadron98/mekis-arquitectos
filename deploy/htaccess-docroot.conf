# --- Proteccion de archivos internos ---------------------------------------
# El DocumentRoot apunta a la raiz del proyecto Laravel y no a public/, asi que
# los archivos internos quedan accesibles por web. En agosto de 2026 se podian
# descargar /storage/logs/laravel.log y /.git/config desde internet.
# Lo correcto a futuro es mover el DocumentRoot a public_html/public.
<IfModule mod_rewrite.c>
    RewriteEngine on

    # Una sola direccion canonica. Hasta ahora www y el dominio sin www
    # respondian 200 por separado y cada uno se declaraba canonico de si
    # mismo, asi que Google veia dos sitios identicos y repartia las senales.
    RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
    RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]
    RewriteRule ^\.(env|git|idea|vscode) - [F,L]
    # vendor.* y node_modules.* con comodin a proposito: un respaldo llamado
    # vendor_viejo quedo servible por web hasta que se detecto.
    RewriteRule ^(app|bootstrap|config|database|resources|routes|storage|tests|vendor[^/]*|node_modules[^/]*)/ - [F,L]
    RewriteRule ^(artisan|server\.php|composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|webpack\.mix\.js|docker-compose\.yml|README\.md)$ - [F,L]
    RewriteRule \.(zip|tar|gz|tgz|bak|sql|log|env)$ - [F,L]
    # Ningun directorio de estaticos debe ejecutar PHP jamas. Vale aunque
    # el archivo llegue por FTP, cPanel o una credencial robada.
    RewriteRule ^(public/)?(assets|css|js|img|web|storage|contenido|previsualizaciones|fonts)/.*\.(php|phtml|phar|pht|php[0-9]|phps)$ - [F,L]
</IfModule>


RewriteEngine on 
RewriteCond %{HTTP_HOST} ^(www.)?mekisarquitectos.cl$ 
RewriteCond %{REQUEST_URI} !^/public/ 
RewriteCond %{REQUEST_FILENAME} !-f 
RewriteCond %{REQUEST_FILENAME} !-d 
RewriteRule ^(.*)$ /public/$1 
RewriteCond %{HTTP_HOST} ^(www.)?mekisarquitectos.cl$ 
RewriteRule ^(/)?$ public/index.php [L]

# php -- BEGIN cPanel-generated handler, do not edit
# Set the “ea-php84” package as the default “PHP” programming language.
<IfModule mime_module>
  AddHandler application/x-httpd-ea-php84___lsphp .php .php8 .phtml
</IfModule>
# php -- END cPanel-generated handler, do not edit

